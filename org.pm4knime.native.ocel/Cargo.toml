[package]
name = "pm4knime_ocel_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
crate-type = ["cdylib"]

[dependencies]
arrow-array = "=52.2.0"
arrow-ipc = "=52.2.0"
arrow-schema = "=52.2.0"
jni = "=0.21.1"
once_cell = "1.18"
process_mining = { version = "=0.3.19", features = ["ocel-sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Keep the native bridge buildable with the Rust/Cargo toolchain currently used by this workspace.
chrono = "=0.4.38"
hashbrown = "=0.14.5"
indexmap = "=2.2.6"
uuid = "=1.4.1"
